name: Collect sealed prices

on:
  schedule:
    # TCGCSV refreshes at ~20:05 UTC. The second run is a catch-up that
    # exits immediately if the day was already collected.
    - cron: "47 21 * * *"
    - cron: "47 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

env:
  DATA_URI: r2://sealed-data

# Secrets (D-30) reach only the steps that touch R2. Tests run in their own
# job with no secrets, so nothing installed for testing shares a runner with
# them. The R2 token is Object Read & Write on sealed-data and sealed-public
# only; SEALED_DATA_KEY encrypts every Parquet file (D-31).

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  collect:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Collect today's snapshot into R2
        env: &r2_and_key
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SEALED_DATA_KEY: ${{ secrets.SEALED_DATA_KEY }}
        run: python -m sealed.collect --overrides config/overrides.csv
      - name: Build the private gold layer into R2 (gold/)
        env: *r2_and_key
        run: python -m sealed.gold --out gold --upload gold
      - name: Check that every Parquet file in the bucket is encrypted (needs no key)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python -m sealed.crypto audit

  publish:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Build the public dashboard and upload it to the public bucket
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SEALED_DATA_KEY: ${{ secrets.SEALED_DATA_KEY }}  # to read prices; the page itself is plaintext
        run: python -m sealed.site --public --out site/index.html --upload-uri r2://sealed-public
      - name: Check out the showcase repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SHOWCASE_REPO }}
          ssh-key: ${{ secrets.SHOWCASE_DEPLOY_KEY }}
          path: showcase
      - name: Sync allowlisted code to the showcase repo
        run: |
          python -m sealed.publish --dest showcase
          cd showcase
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Showcase code unchanged."
          else
            git commit -m "sync: showcase code from private engine"
            git push
          fi
